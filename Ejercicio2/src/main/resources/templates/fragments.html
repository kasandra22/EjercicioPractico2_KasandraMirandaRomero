<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <title th:text="${titulo} + ' - MediCare'">
        MediCare
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>

    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>

<body>

<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-medicare shadow-sm">

    <div class="container">

        <!-- LOGO / NOMBRE -->
        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            MediCare
        </a>

        <!-- BOTÓN RESPONSIVE -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
                aria-controls="navMenu"
                aria-expanded="false"
                aria-label="Abrir navegación">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- MENÚ -->
        <div class="collapse navbar-collapse"
             id="navMenu">

            <!-- OPCIONES PRINCIPALES -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- INICIO -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/}">
                        Inicio
                    </a>

                </li>

                <!-- USUARIOS -->
                <li class="nav-item"
                    sec:authorize="hasAuthority('ROLE_ADMIN')">

                    <a class="nav-link"
                       th:href="@{/usuarios}">
                        Usuarios
                    </a>

                </li>

                <!-- ROLES -->
                <li class="nav-item"
                    sec:authorize="hasAuthority('ROLE_ADMIN')">

                    <a class="nav-link"
                       th:href="@{/roles}">
                        Roles
                    </a>

                </li>

                <!-- CITAS -->
                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <a class="nav-link"
                       th:href="@{/citas}">
                        Citas Médicas
                    </a>

                </li>

                <!-- CONSULTAS -->
                <li class="nav-item"
                    sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_MEDICO')">

                    <a class="nav-link"
                       th:href="@{/consultas}">
                        Consultas Avanzadas
                    </a>

                </li>

            </ul>


            <!-- =================================================
                 PARTE DERECHA DEL NAVBAR
                 ================================================= -->

            <ul class="navbar-nav">

                <!-- USUARIO LOGUEADO -->
                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <span class="nav-link"
                          sec:authentication="name">
                        usuario
                    </span>

                </li>


                <!-- CERRAR SESIÓN -->
                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <form th:action="@{/logout}"
                          method="post"
                          class="d-inline">

                        <button type="submit"
                                class="btn btn-outline-light btn-sm ms-2">

                            Cerrar sesión

                        </button>

                    </form>

                </li>


                <!-- INICIAR SESIÓN -->
                <li class="nav-item"
                    sec:authorize="!isAuthenticated()">

                    <a class="btn btn-outline-light btn-sm"
                       th:href="@{/login}">

                        Iniciar sesión

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer th:fragment="footer"
        class="footer-medicare text-center py-3 mt-5">

    <div class="container">

        <small>

            &copy; 2026 MediCare -
            Plataforma de Servicios de Salud.
            Todos los derechos reservados.

        </small>

    </div>

</footer>


<!-- =====================================================
     BOOTSTRAP JS
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
