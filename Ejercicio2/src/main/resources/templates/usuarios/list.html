<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Usuarios')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Gestión de Usuarios</h2>
        <a href="/usuarios/nuevo" class="btn btn-primary">+ Nuevo Usuario</a>
    </div>

    <div class="card card-medicare p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Activo</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.rol != null ? usuario.rol.nombre : '-'}"></td>
                <td>
                    <span class="badge bg-success" th:if="${usuario.activo}">Activo</span>
                    <span class="badge bg-secondary" th:unless="${usuario.activo}">Inactivo</span>
                </td>
                <td>
                    <a th:href="@{/usuarios/detalle/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline-info">Ver</a>
                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                    <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Eliminar este usuario?');">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="6" class="text-center text-muted">No hay usuarios registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
