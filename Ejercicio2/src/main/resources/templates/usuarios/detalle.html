<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Detalle de Usuario')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-5">
    <div class="card card-medicare p-4" style="max-width: 600px; margin: 0 auto;">
        <h3 class="fw-bold mb-4">Detalle del Usuario</h3>
        <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></p>
        <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
        <p><strong>Rol:</strong> <span th:text="${usuario.rol != null ? usuario.rol.nombre : '-'}"></span></p>
        <p><strong>Estado:</strong> <span th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></span></p>
        <p><strong>Fecha de creación:</strong> <span th:text="${usuario.fechaCreacion}"></span></p>
        <a href="/usuarios" class="btn btn-secondary">Volver</a>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
