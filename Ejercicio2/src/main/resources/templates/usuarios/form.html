<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Formulario de Usuario')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-5">
    <div class="card card-medicare p-4" style="max-width: 600px; margin: 0 auto;">
        <h3 class="fw-bold mb-4" th:text="${usuario.id == null ? 'Nuevo Usuario' : 'Editar Usuario'}"></h3>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" th:field="*{nombre}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" th:field="*{email}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="text" th:field="*{password}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select th:field="*{rol}" class="form-select" required>
                    <option value="">Seleccione un rol</option>
                    <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombre}"></option>
                </select>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{activo}" class="form-check-input"/>
                <label class="form-check-label">Activo</label>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/usuarios" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
