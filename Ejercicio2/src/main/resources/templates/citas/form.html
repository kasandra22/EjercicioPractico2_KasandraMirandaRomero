<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Formulario de Cita')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-5">
    <div class="card card-medicare p-4" style="max-width: 600px; margin: 0 auto;">
        <h3 class="fw-bold mb-4" th:text="${cita.id == null ? 'Nueva Cita Médica' : 'Editar Cita Médica'}"></h3>

        <form th:action="@{/citas/guardar}" th:object="${cita}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Nombre del paciente</label>
                <input type="text" th:field="*{pacienteNombre}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Especialidad</label>
                <input type="text" th:field="*{especialidad}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" th:field="*{fecha}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Costo</label>
                <input type="number" step="0.01" th:field="*{costo}" class="form-control" required/>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{activa}" class="form-check-input"/>
                <label class="form-check-label">Activa</label>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/citas" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
