<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Consultas Avanzadas')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-5">
    <h2 class="fw-bold mb-4">Consultas Avanzadas</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card card-medicare p-3 text-center">
                <h6>Total citas activas</h6>
                <h3 class="text-primary" th:text="${totalCitasActivas}"></h3>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <!-- Consulta 1: por estado -->
        <div class="col-md-6">
            <div class="card card-medicare p-3">
                <h6 class="fw-bold">1. Citas por estado</h6>
                <div class="btn-group">
                    <a href="/consultas/por-estado?activa=true" class="btn btn-sm btn-outline-success">Activas</a>
                    <a href="/consultas/por-estado?activa=false" class="btn btn-sm btn-outline-secondary">Inactivas</a>
                </div>
            </div>
        </div>

        <!-- Consulta 2: por rango de fechas -->
        <div class="col-md-6">
            <div class="card card-medicare p-3">
                <h6 class="fw-bold">2. Citas por rango de fechas</h6>
                <form action="/consultas/por-fecha" method="get" class="row g-2">
                    <div class="col-5"><input type="date" name="desde" class="form-control form-control-sm" required/></div>
                    <div class="col-5"><input type="date" name="hasta" class="form-control form-control-sm" required/></div>
                    <div class="col-2"><button class="btn btn-sm btn-primary w-100">Ir</button></div>
                </form>
            </div>
        </div>

        <!-- Consulta 3: por especialidad -->
        <div class="col-md-6">
            <div class="card card-medicare p-3">
                <h6 class="fw-bold">3. Citas por especialidad (coincidencia parcial)</h6>
                <form action="/consultas/por-especialidad" method="get" class="d-flex gap-2">
                    <input type="text" name="especialidad" class="form-control form-control-sm" placeholder="Ej: Cardio" required/>
                    <button class="btn btn-sm btn-primary">Buscar</button>
                </form>
            </div>
        </div>

        <!-- Consulta 4: usuarios por rol -->
        <div class="col-md-6">
            <div class="card card-medicare p-3">
                <h6 class="fw-bold">4. Usuarios por rol asignado</h6>
                <div class="btn-group">
                    <a href="/consultas/por-rol?rol=ADMIN" class="btn btn-sm btn-outline-primary">ADMIN</a>
                    <a href="/consultas/por-rol?rol=MEDICO" class="btn btn-sm btn-outline-primary">MEDICO</a>
                    <a href="/consultas/por-rol?rol=PACIENTE" class="btn btn-sm btn-outline-primary">PACIENTE</a>
                </div>
            </div>
        </div>
    </div>

    <div class="card card-medicare p-3" th:if="${tipoConsulta}">
        <h5 class="fw-bold" th:text="${tipoConsulta}"></h5>

        <table class="table table-hover" th:if="${resultadoCitas}">
            <thead>
            <tr>
                <th>Paciente</th>
                <th>Especialidad</th>
                <th>Fecha</th>
                <th>Costo</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cita : ${resultadoCitas}">
                <td th:text="${cita.pacienteNombre}"></td>
                <td th:text="${cita.especialidad}"></td>
                <td th:text="${cita.fecha}"></td>
                <td th:text="${'₡' + cita.costo}"></td>
                <td th:text="${cita.activa ? 'Activa' : 'Inactiva'}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(resultadoCitas)}">
                <td colspan="5" class="text-center text-muted">Sin resultados.</td>
            </tr>
            </tbody>
        </table>

        <table class="table table-hover" th:if="${resultadoUsuarios}">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${resultadoUsuarios}">
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.rol.nombre}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(resultadoUsuarios)}">
                <td colspan="3" class="text-center text-muted">Sin resultados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
