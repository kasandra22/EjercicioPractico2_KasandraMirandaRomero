<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Roles')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Gestión de Roles</h2>
        <a href="/roles/nuevo" class="btn btn-primary">+ Nuevo Rol</a>
    </div>

    <div class="card card-medicare p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rol : ${roles}">
                <td th:text="${rol.id}"></td>
                <td th:text="${rol.nombre}"></td>
                <td>
                    <a th:href="@{/roles/editar/{id}(id=${rol.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                    <a th:href="@{/roles/eliminar/{id}(id=${rol.id})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Eliminar este rol?');">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(roles)}">
                <td colspan="3" class="text-center text-muted">No hay roles registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
